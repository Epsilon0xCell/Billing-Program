<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 190" role="img" aria-label="The Chalk Receipt, animated blackboard scene">
  <rect width="800" height="190" fill="#14161a"/>
  <rect x="8" y="8" width="784" height="174" fill="none" stroke="#f5f2ea" stroke-width="2" opacity="0.35"/>
  <g id="receipt" stroke="#f5f2ea" fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M60 42 H470 M60 42 V150 M470 42 V150 M60 150 L78 160 L96 150 L114 160 L132 150 L150 160 L168 150 L186 160 L204 150 L222 160 L240 150 L258 160 L276 150 L294 160 L312 150 L330 160 L348 150 L366 160 L384 150 L402 160 L420 150 L438 160 L470 150">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M84 70 H330 M84 94 H290 M84 118 H350" opacity="0.8"/>
  </g>
  <g font-family="monospace" font-size="17" fill="#f5f2ea">
    <text x="84" y="66">ITEM ........ 100.00</text>
    <text x="520" y="66">TAX</text><text x="520" y="118">TIP</text>
  </g>
  <g fill="none" stroke="#f5f2ea" stroke-width="3">
    <rect x="512" y="76" width="92" height="30"/><rect x="512" y="128" width="92" height="30"/>
  </g>
  <g font-family="monospace" font-size="16" fill="#f5f2ea"><text x="528" y="97">5.50</text><text x="524" y="149">20.00</text></g>
  <path d="M612 92 L648 92" stroke="#f5f2ea" stroke-width="3"/>
  <g id="total">
    <ellipse cx="690" cy="112" rx="72" ry="42" fill="none" stroke="#e5484d" stroke-width="5">
      <animate attributeName="rx" values="72;76;72" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="42;45;42" dur="3.5s" repeatCount="indefinite"/>
    </ellipse>
    <text x="690" y="106" font-family="monospace" font-size="15" fill="#f5f2ea" text-anchor="middle">TOTAL</text>
    <text x="690" y="130" font-family="monospace" font-size="19" fill="#e5484d" text-anchor="middle">$125.50</text>
  </g>
  <g fill="#f5f2ea"><circle r="3"><animateMotion dur="6s" repeatCount="indefinite" path="M40 170 H760"/></circle><circle r="2"><animateMotion dur="9s" begin="-3s" repeatCount="indefinite" path="M760 24 H40"/></circle></g>
</svg>
